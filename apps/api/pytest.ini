[pytest]
# Without asyncio_mode=auto every `async def test_*` in tests/test_api.py was
# silently collected-and-skipped by pytest-asyncio's strict mode: the suite
# reported green while running nothing. Auto mode makes them actually execute.
asyncio_mode = auto

# The `engine` fixture is session-scoped and async, so it needs a session-wide
# event loop; pytest-asyncio's default per-function loop scope breaks it.
asyncio_default_fixture_loop_scope = session

testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers --tb=short
