[pytest]
# Without asyncio_mode=auto every `async def test_*` in tests/test_api.py was
# silently collected-and-skipped by pytest-asyncio's strict mode: the suite
# reported green while running nothing. Auto mode makes them actually execute.
asyncio_mode = auto

# The `engine` fixture is session-scoped and async, and pytest-asyncio 1.x
# defaults test loops to function scope: an asyncpg connection created in the
# session loop then used in a function loop raises "attached to a different
# loop". Session loop scope for BOTH fixtures and tests fixes the binding.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers --tb=short
